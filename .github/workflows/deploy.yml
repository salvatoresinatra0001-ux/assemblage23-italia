name: Deploy Assemblage 23 Italia to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare and validate website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -f site/index.html ]; then
            echo "Deploying editable site/ (canonical content)"
            cp -a site/. _site/
          elif [ -f assemblage23-italia-v20-PAGES-READY.zip ]; then
            echo "Fallback: deploying historical v20.0 archive"
            unzip -q assemblage23-italia-v20-PAGES-READY.zip -d _extract
            test -f _extract/site/index.html
            cp -a _extract/site/. _site/
          else
            echo "::error::No deployable website found"; exit 1
          fi
          # Publish only the existing, unmodified discographic cover assets.
          mkdir -p _site/assets/copertine-originali
          cp gallerie/copertine-medium/assets/covers/*.jpg _site/assets/copertine-originali/
          test -s _site/discografia-streaming.html
          test -s _site/index.html
          touch _site/.nojekyll
          if [ -f _site/a23-data.js ]; then
            for f in a23-data.js image-slot.js support.js; do
              test -s "_site/$f" || { echo "::error::Missing $f"; exit 1; }
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
